name: Build Standalone Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify Android SDK
        run: test -d "$ANDROID_HOME"
      - name: Install dependencies
        run: npm install
      - name: Generate native Android project
        run: npx expo prebuild --platform android --non-interactive --clean
      - name: Build standalone release APK with embedded JS bundle
        env:
          NODE_ENV: production
        run: |
          cd android
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace
      - name: Upload standalone release APK
        uses: actions/upload-artifact@v4
        with:
          name: Hafiz-Online-Bazar-Standalone-APK
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
